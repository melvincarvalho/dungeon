<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser RPG (Preact + htm)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'dm-purple': '#9d79d6',
              'player-green': '#79d67a'
            }
          }
        }
      }
    </script>
  </head>
  <body class="h-full bg-gray-900 text-gray-100 font-sans">
    <div id="app" class="h-full flex flex-col"></div>
    <script type="module">
      import {
        html,
        render,
        useState,
        useEffect,
        useRef
      } from 'https://unpkg.com/htm@3.1.1/preact/standalone.module.js'

      // ----- static data ----------------------------------------------------
      const GENRES = {
        Fantasy: [
          'Noble',
          'Peasant',
          'Mage',
          'Knight',
          'Ranger',
          'Thief',
          'Bard',
          'Cleric',
          'Assassin',
          'Paladin'
        ],
        'Sci‑Fi': [
          'Space Marine',
          'Scientist',
          'Android',
          'Pilot',
          'Engineer',
          'Bounty Hunter',
          'Starship Captain'
        ],
        Cyberpunk: [
          'Hacker',
          'Street Samurai',
          'Corporate Agent',
          'Techie',
          'Cyborg'
        ],
        'Post‑Apocalyptic': ['Survivor', 'Scavenger', 'Raider', 'Medic']
      }

      const ROLE_STARTERS = {
        Fantasy: {
          Peasant: "You're toiling in the fields of a small village when",
          Noble: "You're overseeing your estate's affairs when",
          Mage: "You're studying ancient tomes in your tower when",
          Knight: "You're training in the castle courtyard when",
          Ranger: "You're tracking game in the deep forest when",
          Thief: "You're casing a noble's manor in the city when",
          Bard: "You're performing in a crowded tavern when",
          Cleric: "You're tending to the sick in the temple when",
          Assassin: "You're preparing for a contract in the shadows when",
          Paladin: "You're praying at the altar of your deity when"
        },
        'Sci‑Fi': {
          'Space Marine':
            "You're conducting patrol on a derelict space station when",
          Scientist: "You're analyzing alien samples in your lab when",
          Android: "You're performing system diagnostics on your ship when",
          Pilot: "You're navigating through an asteroid field when",
          Engineer: "You're repairing the FTL drive when",
          'Bounty Hunter': "You're tracking a target through a spaceport when",
          'Starship Captain':
            "You're commanding the bridge during warp travel when"
        },
        Cyberpunk: {
          Hacker: "You're infiltrating a corporate network when",
          'Street Samurai': "You're patrolling the neon‑lit streets when",
          'Corporate Agent': "You're closing a deal in a high‑rise office when",
          Techie: "You're modifying cyberware in your workshop when",
          Cyborg: "You're calibrating your cybernetic enhancements when"
        },
        'Post‑Apocalyptic': {
          Survivor: "You're scavenging in the ruins of an old city when",
          Scavenger: "You're searching a pre‑collapse bunker when",
          Raider: "You're ambushing a convoy in the wasteland when",
          Medic: "You're treating radiation sickness in your clinic when"
        }
      }

      function getRoleStarter(genre, role) {
        return (
          ROLE_STARTERS[genre]?.[role] ||
          'You find yourself in an unexpected situation when'
        )
      }

      function buildSystemPrompt({ genre, role, name, starter }) {
        return `You are a masterful Dungeon Master guiding an immersive role‑playing adventure set in a richly detailed ${genre} world. Your responses MUST follow these rules:\n\n1. RESPOND TO PLAYER ACTIONS:\n   • Always incorporate and react to the player's most recent action\n   • Make the player feel their choices directly impact the story\n   • Progress the narrative based on the player's decisions\n\n2. CONTENT RULES:\n   • NEVER ask direct questions (e.g., "What do you do?")\n   • ALWAYS use NPCs to interact through dialogue/actions\n   • ALWAYS use proper punctuation\n   • RESPOND ONLY AS DUNGEON MASTER\n   • Keep responses concise (max 150 tokens)\n\n3. NARRATIVE FLOW:\n   • Describe immediate consequences of player actions\n   • Advance the story with new challenges/revelations\n   • Maintain consistent world logic\n\nADVENTURE START: ${name} the ${role} begins with:\n${starter}`
      }

      // ----- helpers --------------------------------------------------------
      async function callOpenAI({ key, messages }) {
        const resp = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${key}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            messages,
            temperature: 0.7,
            top_p: 0.95,
            max_tokens: 180,
            stop: ['\n\n']
          })
        })
        if (!resp.ok) throw new Error(await resp.text())
        const json = await resp.json()
        return json.choices?.[0]?.message?.content?.trim() || ''
      }

      // ----- components -----------------------------------------------------
      function Config({ onStart }) {
        const [genre, setGenre] = useState(Object.keys(GENRES)[0])
        const [role, setRole] = useState(GENRES[genre][0])
        const [name, setName] = useState('Bob')

        useEffect(() => {
          setRole(GENRES[genre][0])
        }, [genre])

        return html`
          <div
            class="min-h-full flex items-center justify-center bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 p-4"
          >
            <div
              class="bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700 max-w-md w-full"
            >
              <h1
                class="text-3xl font-bold text-center mb-8 text-transparent bg-clip-text bg-gradient-to-r from-dm-purple to-player-green"
              >
                Start Your Adventure
              </h1>

              <div class="space-y-6">
                <div>
                  <label class="block text-sm font-medium text-gray-300 mb-2"
                    >Genre</label
                  >
                  ${html`<select
                    value=${genre}
                    onInput=${e => setGenre(e.target.value)}
                    class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:ring-2 focus:ring-dm-purple focus:border-transparent transition-all"
                  >
                    ${Object.keys(GENRES).map(
                      g => html`<option value=${g}>${g}</option>`
                    )}
                  </select>`}
                </div>

                <div>
                  <label class="block text-sm font-medium text-gray-300 mb-2"
                    >Role</label
                  >
                  ${html`<select
                    value=${role}
                    onInput=${e => setRole(e.target.value)}
                    class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:ring-2 focus:ring-dm-purple focus:border-transparent transition-all"
                  >
                    ${GENRES[genre].map(
                      r => html`<option value=${r}>${r}</option>`
                    )}
                  </select>`}
                </div>

                <div>
                  <label class="block text-sm font-medium text-gray-300 mb-2"
                    >Character Name</label
                  >
                  <input
                    type="text"
                    value=${name}
                    onInput=${e => setName(e.target.value)}
                    class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:ring-2 focus:ring-dm-purple focus:border-transparent transition-all"
                    placeholder="Enter your character's name"
                  />
                </div>

                <button
                  onClick=${() => onStart({ genre, role, name })}
                  class="w-full bg-gradient-to-r from-dm-purple to-purple-600 hover:from-purple-600 hover:to-dm-purple text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 transform hover:scale-105 shadow-lg"
                >
                  Begin Adventure
                </button>
              </div>
            </div>
          </div>
        `
      }

      function Chat({ apiKey, config, onNewCharacter }) {
        const scrollRef = useRef(null)
        const [messages, setMessages] = useState(() => {
          const sys = {
            role: 'system',
            content: buildSystemPrompt({
              ...config,
              starter: getRoleStarter(config.genre, config.role)
            })
          }
          return [sys]
        })
        const [input, setInput] = useState('')
        const [loading, setLoading] = useState(false)
        const [showConfirm, setShowConfirm] = useState(false)

        useEffect(() => {
          if (scrollRef.current)
            scrollRef.current.scrollTop = scrollRef.current.scrollHeight
        }, [messages])

        // ----- send player input ------------------------------------------
        async function send() {
          if (!input.trim() || loading) return
          const userMsg = { role: 'user', content: input.trim() }
          setMessages(m => [...m, userMsg])
          setInput('')
          setLoading(true)
          try {
            const assistantContent = await callOpenAI({
              key: apiKey,
              messages: [...messages, userMsg]
            })
            const assistantMsg = {
              role: 'assistant',
              content: assistantContent
            }
            setMessages(m => [...m, assistantMsg])
          } catch (err) {
            alert('OpenAI error: ' + err.message)
          } finally {
            setLoading(false)
          }
        }

        // ----- UI ---------------------------------------------------------
        const confirmModal =
          showConfirm &&
          html`
            <div
              class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50"
            >
              <div
                class="bg-gray-800 p-6 rounded-2xl shadow-2xl border border-gray-700 max-w-sm w-full"
              >
                <h3 class="text-lg font-semibold text-white mb-4">
                  Start New Adventure?
                </h3>
                <p class="text-gray-400 mb-6">
                  This will create a new character and reset your current
                  adventure. This action cannot be undone.
                </p>
                <div class="flex gap-3">
                  <button
                    onClick=${() => setShowConfirm(false)}
                    class="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded-lg transition-all"
                  >
                    Cancel
                  </button>
                  <button
                    onClick=${() => {
                      setShowConfirm(false)
                      onNewCharacter()
                    }}
                    class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-lg transition-all"
                  >
                    New Character
                  </button>
                </div>
              </div>
            </div>
          `

        return html`${confirmModal}
          <header
            class="bg-gray-800 border-b border-gray-700 px-6 py-4 shadow-lg"
          >
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-4">
                <h2
                  class="text-xl font-semibold text-transparent bg-clip-text bg-gradient-to-r from-dm-purple to-player-green"
                >
                  ${config.name} the ${config.role}
                </h2>
                <span
                  class="text-sm text-gray-400 bg-gray-700 px-3 py-1 rounded-full"
                >
                  ${config.genre}
                </span>
              </div>
              <button
                onClick=${() => setShowConfirm(true)}
                class="text-sm bg-gray-700 hover:bg-gray-600 text-gray-300 hover:text-white px-3 py-2 rounded-lg transition-all duration-200 border border-gray-600 hover:border-gray-500"
              >
                New Character
              </button>
            </div>
          </header>

          <main
            ref=${scrollRef}
            class="flex-1 overflow-y-auto p-6 space-y-4 bg-gradient-to-b from-gray-900 to-gray-800"
          >
            ${messages
              .filter(m => m.role !== 'system')
              .map(
                m =>
                  html`<div
                    class="flex ${m.role === 'assistant'
                      ? 'justify-start'
                      : 'justify-end'}"
                  >
                    <div
                      class="max-w-2xl px-4 py-3 rounded-2xl shadow-lg ${m.role ===
                      'assistant'
                        ? 'bg-gray-700 border-l-4 border-dm-purple text-gray-100'
                        : 'bg-gradient-to-r from-player-green to-green-600 text-white ml-auto'}"
                    >
                      <div class="whitespace-pre-wrap">${m.content}</div>
                    </div>
                  </div>`
              )}
            ${loading &&
            html`<div class="flex justify-start">
              <div
                class="bg-gray-700 border-l-4 border-dm-purple text-gray-100 px-4 py-3 rounded-2xl shadow-lg animate-pulse"
              >
                <div class="flex space-x-1">
                  <div
                    class="w-2 h-2 bg-dm-purple rounded-full animate-bounce"
                  ></div>
                  <div
                    class="w-2 h-2 bg-dm-purple rounded-full animate-bounce"
                    style="animation-delay: 0.1s"
                  ></div>
                  <div
                    class="w-2 h-2 bg-dm-purple rounded-full animate-bounce"
                    style="animation-delay: 0.2s"
                  ></div>
                </div>
              </div>
            </div>`}
          </main>

          <form
            class="bg-gray-800 border-t border-gray-700 p-4 shadow-lg"
            onSubmit=${e => {
              e.preventDefault()
              send()
            }}
          >
            <div class="flex gap-3">
              <input
                type="text"
                value=${input}
                placeholder="Describe your action..."
                onInput=${e => setInput(e.target.value)}
                class="flex-1 bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:ring-2 focus:ring-dm-purple focus:border-transparent transition-all placeholder-gray-400"
                disabled=${loading}
              />
              <button
                type="submit"
                disabled=${loading || !input.trim()}
                class="bg-gradient-to-r from-dm-purple to-purple-600 hover:from-purple-600 hover:to-dm-purple disabled:from-gray-600 disabled:to-gray-700 text-white font-semibold px-6 py-3 rounded-lg transition-all duration-200 transform hover:scale-105 disabled:transform-none disabled:cursor-not-allowed shadow-lg"
              >
                ${loading ? 'Sending...' : 'Send'}
              </button>
            </div>
          </form> `
      }

      function App() {
        const [apiKey, setApiKey] = useState(
          () => localStorage.getItem('OPENAI_KEY') || ''
        )
        const [gameConfig, setGameConfig] = useState(() => {
          const saved = localStorage.getItem('GAME_CONFIG')
          return saved ? JSON.parse(saved) : null
        })
        const [keyInput, setKeyInput] = useState('')

        function saveKey(key) {
          if (key && key.trim()) {
            localStorage.setItem('OPENAI_KEY', key.trim())
            setApiKey(key.trim())
            setKeyInput('')
          }
        }

        function startNewGame(config) {
          localStorage.setItem('GAME_CONFIG', JSON.stringify(config))
          setGameConfig(config)
        }

        function resetCharacter() {
          localStorage.removeItem('GAME_CONFIG')
          setGameConfig(null)
        }

        // Key modal shown if missing
        const keyModal =
          !apiKey &&
          html` <div
            class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50"
          >
            <div
              class="bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700 max-w-md w-full"
            >
              <div class="text-center mb-6">
                <h1
                  class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-dm-purple to-player-green mb-2"
                >
                  OpenAI API Key Required
                </h1>
                <p class="text-gray-400 text-sm">
                  Enter your OpenAI API key to start your adventure
                </p>
              </div>

              <div class="space-y-4">
                <input
                  type="password"
                  placeholder="sk-..."
                  value=${keyInput}
                  onInput=${e => setKeyInput(e.target.value)}
                  onKeydown=${e => {
                    if (e.key === 'Enter') saveKey(keyInput)
                  }}
                  class="w-full bg-gray-700 border border-gray-600 text-white rounded-lg px-4 py-3 focus:ring-2 focus:ring-dm-purple focus:border-transparent transition-all placeholder-gray-500"
                />

                <button
                  onClick=${() => saveKey(keyInput)}
                  disabled=${!keyInput.trim()}
                  class="w-full bg-gradient-to-r from-dm-purple to-purple-600 hover:from-purple-600 hover:to-dm-purple disabled:from-gray-600 disabled:to-gray-700 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 transform hover:scale-105 disabled:transform-none disabled:cursor-not-allowed shadow-lg"
                >
                  Save & Continue
                </button>

                <p class="text-xs text-gray-500 text-center">
                  Your API key is stored locally in your browser
                </p>
              </div>
            </div>
          </div>`

        return html`${keyModal}
        ${!gameConfig && apiKey && html`<${Config} onStart=${startNewGame} />`}
        ${gameConfig &&
        apiKey &&
        html`<${Chat}
          apiKey=${apiKey}
          config=${gameConfig}
          onNewCharacter=${resetCharacter}
        />`}`
      }

      render(html`<${App} />`, document.getElementById('app'))
    </script>
  </body>
</html>
