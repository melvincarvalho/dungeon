<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser RPG Dungeonmastr</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'dm-purple': '#9d79d6',
              'player-green': '#79d67a'
            }
          }
        }
      }
    </script>
    <script type="module">
      // Import secp256k1 for nostr keypair generation
      window.secp256k1 = await import(
        'https://unpkg.com/@noble/secp256k1@2.0.0/index.js'
      )
      // Import nostr-tools for relay publishing
      window.NostrTools = await import('https://esm.sh/nostr-tools@1.14.0')
    </script>
  </head>
  <body class="h-full font-sans">
    <div id="app" class="h-full flex flex-col"></div>
    <script type="module" src="index.js"></script>
  </body>
</html>
